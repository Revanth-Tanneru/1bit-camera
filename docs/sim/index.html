<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1 Bit Camera Simulator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh}
.app{max-width:1100px;margin:0 auto;padding:20px}
h1{font-size:22px;margin-bottom:16px;color:#e94560}
.controls{background:#16213e;border-radius:10px;padding:16px;margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ctrl-group{display:flex;flex-direction:column;gap:4px}
.ctrl-group label{font-size:12px;color:#aaa;text-transform:uppercase;letter-spacing:.5px}
.ctrl-row{display:flex;align-items:center;gap:10px}
.ctrl-row input[type=range]{flex:1;accent-color:#e94560}
.ctrl-row .val{min-width:28px;text-align:right;font-variant-numeric:tabular-nums;font-size:14px;color:#e94560;font-weight:600}
select,input[type=file]::file-selector-button,.btn{background:#0f3460;color:#e0e0e0;border:1px solid #1a1a5e;padding:6px 12px;border-radius:6px;font-size:13px;cursor:pointer}
select{background:#0f3460;color:#e0e0e0;padding:6px 8px}
.btn:hover,input[type=file]::file-selector-button:hover{background:#1a1a5e}
.btn.primary{background:#e94560;color:#fff;border-color:#e94560}
.btn.primary:hover{background:#d63851}
.display{background:#0f3460;border-radius:10px;padding:14px 16px;margin-bottom:16px;font-family:'Courier New',monospace;font-size:14px;line-height:1.6;min-height:80px;border:1px solid #1a1a5e}
.display .row{display:flex;justify-content:space-between}
.display .status{color:#aaa;font-size:12px}
.canvas-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.canvas-box{background:#16213e;border-radius:10px;padding:12px;text-align:center}
.canvas-box h3{font-size:12px;color:#aaa;margin-bottom:6px;text-transform:uppercase}
.canvas-box canvas{max-width:100%;border:1px solid #1a1a5e;border-radius:4px;background:#fff;image-rendering:pixelated}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.full{grid-column:1/-1}
@media(max-width:700px){.controls{grid-template-columns:1fr}.canvas-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<h1>&#9881; 1 Bit Camera Simulator</h1>

<div class="controls">
  <div class="ctrl-group">
    <label>Image</label>
    <input type="file" id="fileInput" accept="image/*,video/*">
  </div>
  <div class="ctrl-group">
    <label>Effect</label>
    <select id="effectSelect"></select>
  </div>
  <div class="ctrl-group">
    <label>Mode Selector (GPIO 33)</label>
    <div style="display:flex;gap:12px;padding-top:4px">
      <label><input type="radio" name="dialMode" value="thresh" checked> Threshold</label>
      <label><input type="radio" name="dialMode" value="size"> Size</label>
      <label><input type="radio" name="dialMode" value="levels"> Levels</label>
    </div>
  </div>
  <div class="ctrl-group">
    <label id="szLabel">Value (GPIO 2)</label>
    <div class="ctrl-row">
      <input type="range" id="szSlider" min="0" max="255" value="128">
      <span class="val" id="szVal">128</span>
    </div>
  </div>
  <div class="ctrl-group">
    <label>Toggles</label>
    <div style="display:flex;gap:16px;padding-top:4px">
      <label><input type="checkbox" id="invertChk"> Invert</label>
      <label><input type="checkbox" id="preprocChk" checked> Preprocess</label>
    </div>
  </div>
  <div class="ctrl-group full" style="border-top:1px solid #1a1a5e;padding-top:12px;margin-top:8px">
    <label>Video Flipbook</label>
    <div class="ctrl-row" style="flex-wrap:wrap;gap:8px">
      <select id="vfCount" style="width:110px">
        <option value="10">10 frames</option>
        <option value="25" selected>25 frames</option>
        <option value="60">60 frames</option>
      </select>
      <button class="btn primary" id="videoBtn">&#9654; Capture</button>
      <button class="btn" id="playBtn" disabled>&#9654; Play</button>
      <label style="font-size:13px;display:flex;align-items:center;gap:4px">
        <input type="checkbox" id="stripChk"> Strip
      </label>
      <button class="btn" id="stripSaveBtn" disabled>&#128190; Save Strip</button>
      <span id="videoStatus" style="font-size:12px;color:#aaa"></span>
    </div>
  </div>
</div>

<div class="display" id="display">
  <div class="row"><span id="dispEffect">FS dither</span><span id="dispBt">Sim</span></div>
  <div class="row"><span id="dispParams">th=128 sz=8 lv=3</span><span id="dispModePre">size inv=0</span></div>
  <div class="row"><span id="dispStatus" class="status">Ready</span></div>
</div>

<div class="canvas-row">
  <div class="canvas-box">
    <h3>Input</h3>
    <canvas id="inputCanvas"></canvas>
  </div>
  <div class="canvas-box">
    <h3>Output (384px wide)</h3>
    <canvas id="outputCanvas"></canvas>
  </div>
</div>

<div class="actions">
  <button class="btn primary" id="renderBtn">&#9654; Render</button>
  <button class="btn" id="saveBtn">&#128190; Save PNG</button>
  <button class="btn" id="testcardBtn">&#127912; Test Card</button>
</div>
<video id="hiddenVideo" style="display:none"></video>
</div>

<script>
// ── Effect names (matches firmware FX enum order) ──────────
const FX = [
  {id:0, name:'fs',           label:'FS dither'},
  {id:1, name:'atkinson',     label:'Atkinson'},
  {id:2, name:'jarvis',       label:'Jarvis'},
  {id:3, name:'stucki',       label:'Stucki'},
  {id:4, name:'bayer2',       label:'Bayer 2x2'},
  {id:5, name:'bayer4',       label:'Bayer 4x4'},
  {id:6, name:'bayer8',       label:'Bayer 8x8'},
  {id:7, name:'random',       label:'Random dither'},
  {id:8, name:'threshold',    label:'Threshold'},
  {id:9, name:'halftone',     label:'Halftone'},
  {id:10,name:'line',         label:'Line halftone'},
  {id:11,name:'crosshatch',   label:'Crosshatch'},
  {id:12,name:'pixelate',     label:'Pixelate'},
  {id:13,name:'ascii',        label:'ASCII art'},
  {id:14,name:'binary',       label:'Binary art'},
  {id:15,name:'comic',        label:'Comic'},
  {id:16,name:'silhouette',   label:'Silhouette'},
  {id:17,name:'blocks',       label:'Blocks'},
];
const FX_ASCII = 13, FX_BINARY = 14;

// Effects that use p_dot internally (skip pixel replication)
const FX_INTERNAL_DOT = new Set([12, 15, 17]);

// ── DOM refs ───────────────────────────────────────────────
const $ = id => document.getElementById(id);
const fileInput = $('fileInput');
const effectSel = $('effectSelect');
const szSl = $('szSlider'), szVal = $('szVal');
const invertChk = $('invertChk'), preprocChk = $('preprocChk');
const inputCanvas = $('inputCanvas');
const outputCanvas = $('outputCanvas');
const renderBtn = $('renderBtn'), saveBtn = $('saveBtn'), testcardBtn = $('testcardBtn');
const dispEffect = $('dispEffect'), dispParams = $('dispParams');
const dispBt = $('dispBt'), dispModePre = $('dispModePre'), dispStatus = $('dispStatus');
const szLabel = $('szLabel');
const dialModeRadios = document.querySelectorAll('input[name="dialMode"]');

let sourceImageData = null; // full-res ImageData
let p_thresh = 128, p_dot = 8, p_levels = 3;

// Populate effect dropdown
FX.forEach(f => {
  const o = document.createElement('option');
  o.value = f.id; o.textContent = f.label;
  effectSel.appendChild(o);
});

// ── Slider display ────────────────────────────────────────
szSl.oninput = () => {
  szVal.textContent = szSl.value;
  const v = +szSl.value;
  const mode = getDialMode();
  if (mode === 'thresh') p_thresh = v;
  else if (mode === 'size') p_dot = v;
  else p_levels = v;
  render();
};
invertChk.onchange = preprocChk.onchange = render;
effectSel.onchange = () => { updateDisplay(); render(); };
dialModeRadios.forEach(r => r.onchange = () => { updateDisplay(); render(); });

// ── Generate test card ────────────────────────────────────
function genTestcard(w, h) {
  const data = new Uint8Array(w * h);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const fx = x / w, fy = y / h;
      const cx = fx - 0.5, cy = fy - 0.5;
      const rad = Math.sqrt(cx*cx + cy*cy);
      const ang = Math.atan2(cy, cx);
      let v;
      if (rad < 0.05) v = 255;
      else if (rad < 0.1) v = 0;
      else if (rad < 0.25) v = (Math.sin(ang * 4) * 0.5 + 0.5) * 255;
      else if (rad < 0.35) v = fx * 255;
      else v = fy * 255;
      if (Math.abs(cx + 0.15) < 0.04 && Math.abs(cy + 0.15) < 0.04) v = 0;
      if (Math.abs(cx - 0.15) < 0.04 && Math.abs(cy + 0.15) < 0.04) v = 0;
      if (Math.abs(cy - 0.15) < 0.03 && Math.abs(cx) < 0.08) v = 0;
      data[y * w + x] = Math.max(0, Math.min(255, Math.round(v)));
    }
  return data;
}

testcardBtn.onclick = () => {
  const w = 640, h = 480;
  const data = genTestcard(w, h);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const id = ctx.createImageData(w, h);
  for (let i = 0; i < w * h; i++) { id.data[i*4] = id.data[i*4+1] = id.data[i*4+2] = data[i]; id.data[i*4+3] = 255; }
  ctx.putImageData(id, 0, 0);
  sourceImageData = {data, w, h, canvas, ctx, id};
  inputCanvas.width = w; inputCanvas.height = h;
  inputCanvas.getContext('2d').drawImage(canvas, 0, 0);
  render();
};

// ── File upload (image or video) ───────────────────────────
let videoDuration = 0;
fileInput.onchange = () => {
  const file = fileInput.files[0];
  if (!file) return;

  if (file.type.startsWith('video/')) {
    const video = document.getElementById('hiddenVideo');
    video.src = URL.createObjectURL(file);
    video.onloadedmetadata = () => {
      video.onseeked = () => {
        videoDuration = video.duration;
        const c = document.createElement('canvas');
        c.width = video.videoWidth; c.height = video.videoHeight;
        const ctx = c.getContext('2d');
        ctx.drawImage(video, 0, 0);
        const id = ctx.getImageData(0, 0, c.width, c.height);
        const grey = new Uint8Array(c.width * c.height);
        for (let i = 0; i < grey.length; i++)
          grey[i] = Math.round(id.data[i*4]*0.299 + id.data[i*4+1]*0.587 + id.data[i*4+2]*0.114);
        sourceImageData = {data: grey, w: c.width, h: c.height};
        inputCanvas.width = c.width; inputCanvas.height = c.height;
        const ictx = inputCanvas.getContext('2d');
        for (let i = 0; i < grey.length; i++) id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=grey[i];
        ictx.putImageData(id, 0, 0);
        dispStatus.textContent = 'Video ' + video.duration.toFixed(1) + 's loaded';
        render();
      };
      video.currentTime = 0.1;
    };
    return;
  }

  const img = new Image();
  img.onload = () => {
    videoDuration = 0;
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const id = ctx.getImageData(0, 0, c.width, c.height);
    const grey = new Uint8Array(c.width * c.height);
    for (let i = 0; i < grey.length; i++)
      grey[i] = Math.round(id.data[i*4] * 0.299 + id.data[i*4+1] * 0.587 + id.data[i*4+2] * 0.114);
    sourceImageData = {data: grey, w: c.width, h: c.height};
    inputCanvas.width = c.width; inputCanvas.height = c.height;
    const ictx = inputCanvas.getContext('2d');
    for (let i = 0; i < grey.length; i++) id.data[i*4] = id.data[i*4+1] = id.data[i*4+2] = grey[i];
    ictx.putImageData(id, 0, 0);
    render();
  };
  img.src = URL.createObjectURL(file);
};

// ── Update display ────────────────────────────────────────
function getDialMode() {
  for (const r of dialModeRadios) if (r.checked) return r.value;
  return 'size';
}

function updateDisplay() {
  const fx = FX[+effectSel.value];
  const mode = getDialMode();
  dispEffect.textContent = fx.label;
  dispBt.textContent = 'Sim';

  // Update value slider label, range, and read current
  let val = +szSl.value;
  if (mode === 'thresh') {
    szLabel.textContent = 'Threshold (Dial 2)';
    szSl.min = 0; szSl.max = 255;
    if (val < 0 || val > 255) { szSl.value = 128; val = 128; }
  } else if (mode === 'levels') {
    szLabel.textContent = 'Levels (Dial 2)';
    szSl.min = 2; szSl.max = 6;
    if (val < 2 || val > 6) { szSl.value = 3; val = 3; }
  } else {
    szLabel.textContent = 'Pixel Size (Dial 2)';
    szSl.min = 2; szSl.max = 16;
    if (val < 2 || val > 16) { szSl.value = 8; val = 8; }
  }
  szVal.textContent = szSl.value;

  const disabled = (fx.id === FX_ASCII || fx.id === FX_BINARY);
  szSl.disabled = disabled;

  dispParams.textContent = `th=${p_thresh} sz=${p_dot} lv=${p_levels}`;
  dispModePre.textContent = `${mode} inv=${invertChk.checked?1:0}`;
}

// ── Effects implementation (ported from effects.c) ─────────

// Bilinear resize
function greyResize(src, sw, sh, dw, dh) {
  const dst = new Uint8Array(dw * dh);
  for (let dy = 0; dy < dh; dy++) {
    const syf = (dy + 0.5) * sh / dh - 0.5;
    const sy = Math.max(0, Math.min(sh - 2, Math.floor(syf)));
    const fy = syf - sy;
    for (let dx = 0; dx < dw; dx++) {
      const sxf = (dx + 0.5) * sw / dw - 0.5;
      const sx = Math.max(0, Math.min(sw - 2, Math.floor(sxf)));
      const fx = sxf - sx;
      const v00 = src[sy * sw + sx], v10 = src[sy * sw + sx + 1];
      const v01 = src[(sy+1) * sw + sx], v11 = src[(sy+1) * sw + sx + 1];
      const top = v00 + (v10 - v00) * fx;
      const bot = v01 + (v11 - v01) * fx;
      dst[dy * dw + dx] = Math.round(Math.max(0, Math.min(255, top + (bot - top) * fy)));
    }
  }
  return dst;
}

// Gamma correction
function gammaFromThresh(th) {
  let g = 2.0 - th / 128.0;
  if (g < 0.1) g = 0.1;
  if (g > 3.9) g = 3.9;
  return g;
}

function applyGamma(v, gamma) {
  return Math.round(Math.pow(v / 255, gamma) * 255);
}

// Autocontrast
function preprocAutocontrast(grey, w, h) {
  const n = w * h;
  const hist = new Uint32Array(256);
  for (let i = 0; i < n; i++) hist[grey[i]]++;
  let total = 0, lo = 0, hi = 255;
  const loTarget = Math.max(1, Math.floor(n * 2 / 100));
  const hiTarget = Math.min(n - 1, Math.floor(n * 98 / 100));
  for (let i = 0; i < 256; i++) { total += hist[i]; if (total >= loTarget) { lo = i; break; } }
  total = 0;
  for (let i = 255; i >= 0; i--) { total += hist[i]; if (total >= n - hiTarget) { hi = i; break; } }
  if (hi <= lo + 4) hi = lo + 4;
  if (hi > 255) hi = 255;
  for (let i = 0; i < n; i++) {
    let v = (grey[i] - lo) * 255 / (hi - lo);
    grey[i] = Math.max(0, Math.min(255, Math.round(v)));
  }
}

function preprocGamma(grey, w, h, th) {
  const gamma = gammaFromThresh(th);
  const lut = new Uint8Array(256);
  for (let i = 0; i < 256; i++) lut[i] = Math.round(Math.pow(i / 255, gamma) * 255);
  const n = w * h;
  for (let i = 0; i < n; i++) grey[i] = lut[grey[i]];
}

function preprocSharpen(grey, w, h, strength) {
  if (strength <= 0) return;
  const tmp = new Uint8Array(grey);
  for (let y = 1; y < h - 1; y++)
    for (let x = 1; x < w - 1; x++) {
      const c = tmp[y * w + x];
      const lap = c * 4 - tmp[(y-1)*w+x] - tmp[(y+1)*w+x] - tmp[y*w+x-1] - tmp[y*w+x+1];
      grey[y * w + x] = Math.max(0, Math.min(255, Math.round(c + lap * strength * 0.5)));
    }
}

function preprocAll(grey, w, h, th) {
  preprocAutocontrast(grey, w, h);
  preprocGamma(grey, w, h, th);
  preprocSharpen(grey, w, h, 0.8);
}

// ── Dithers ───────────────────────────────────────────────

function ditherFS(grey, w, h, out) {
  const stride = w + 2;
  let errCur = new Int16Array(stride);
  let errNext = new Int16Array(stride);
  for (let y = 0; y < h; y++) {
    errNext.fill(0);
    for (let x = 0; x < w; x++) {
      const old = grey[y * w + x] + errCur[x + 1];
      const np = old > 128 ? 255 : 0;
      out[y * w + x] = np;
      const err = old - np;
      if (x + 1 < w) errCur[x + 2] += (err * 7) / 16;
      if (x - 1 >= 0) errNext[x] += (err * 3) / 16;
      errNext[x + 1] += (err * 5) / 16;
      if (x + 1 < w) errNext[x + 2] += (err * 1) / 16;
    }
    [errCur, errNext] = [errNext, errCur];
  }
}

function ditherAtkinson(grey, w, h, out) {
  const stride = w + 4;
  let row0 = new Int32Array(stride);
  let row1 = new Int32Array(stride);
  let row2 = new Int32Array(stride);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const old = grey[y * w + x] + row0[x + 2];
      const np = old > 128 ? 255 : 0;
      out[y * w + x] = np;
      const err8 = Math.round((old - np) / 8);
      if (x + 1 < w) row0[x + 3] += err8;
      if (x + 2 < w) row0[x + 4] += err8;
      if (x - 1 >= 0) row1[x + 1] += err8;
      row1[x + 2] += err8;
      if (x + 1 < w) row1[x + 3] += err8;
      row2[x + 2] += err8;
    }
    [row0, row1, row2] = [row1, row2, row0];
    row2 = new Int32Array(stride);
  }
}

function ditherJarvis(grey, w, h, out) {
  const stride = w + 4;
  let r0 = new Int32Array(stride), r1 = new Int32Array(stride), r2 = new Int32Array(stride);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const old = grey[y * w + x] + r0[x + 2];
      const np = old > 128 ? 255 : 0;
      out[y * w + x] = np;
      const err = old - np;
      if (x + 1 < w) r0[x+3] += (err * 7) / 48;
      if (x + 2 < w) r0[x+4] += (err * 5) / 48;
      if (x - 2 >= 0) r1[x] += (err * 3) / 48;
      if (x - 1 >= 0) r1[x+1] += (err * 5) / 48;
      r1[x+2] += (err * 7) / 48;
      if (x + 1 < w) r1[x+3] += (err * 5) / 48;
      if (x + 2 < w) r1[x+4] += (err * 3) / 48;
      if (x - 2 >= 0) r2[x] += (err * 1) / 48;
      if (x - 1 >= 0) r2[x+1] += (err * 3) / 48;
      r2[x+2] += (err * 5) / 48;
      if (x + 1 < w) r2[x+3] += (err * 3) / 48;
      if (x + 2 < w) r2[x+4] += (err * 1) / 48;
    }
    [r0, r1, r2] = [r1, r2, r0];
    r2 = new Int32Array(stride);
  }
}

function ditherStucki(grey, w, h, out) {
  const stride = w + 4;
  let r0 = new Int32Array(stride), r1 = new Int32Array(stride), r2 = new Int32Array(stride);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const old = grey[y * w + x] + r0[x + 2];
      const np = old > 128 ? 255 : 0;
      out[y * w + x] = np;
      const err = old - np;
      if (x + 1 < w) r0[x+3] += (err * 8) / 42;
      if (x + 2 < w) r0[x+4] += (err * 4) / 42;
      if (x - 2 >= 0) r1[x] += (err * 2) / 42;
      if (x - 1 >= 0) r1[x+1] += (err * 4) / 42;
      r1[x+2] += (err * 8) / 42;
      if (x + 1 < w) r1[x+3] += (err * 4) / 42;
      if (x + 2 < w) r1[x+4] += (err * 2) / 42;
      if (x - 2 >= 0) r2[x] += (err * 1) / 42;
      if (x - 1 >= 0) r2[x+1] += (err * 2) / 42;
      r2[x+2] += (err * 4) / 42;
      if (x + 1 < w) r2[x+3] += (err * 2) / 42;
      if (x + 2 < w) r2[x+4] += (err * 1) / 42;
    }
    [r0, r1, r2] = [r1, r2, r0];
    r2 = new Int32Array(stride);
  }
}

function ditherBayer(grey, w, h, out, n) {
  const bayer2 = [[0,2],[3,1]];
  const bayer4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  const bayer8 = [
    [0,48,12,60,3,51,15,63],[32,16,44,28,35,19,47,31],
    [8,56,4,52,11,59,7,55],[40,24,36,20,43,27,39,23],
    [2,50,14,62,1,49,13,61],[34,18,46,30,33,17,45,29],
    [10,58,6,54,9,57,5,53],[42,26,38,22,41,25,37,21]];
  const total = n * n;
  const bayer = n === 2 ? bayer2 : n === 4 ? bayer4 : bayer8;
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const b = bayer[y % n][x % n];
      const t = Math.round((b * 256 + total / 2) / total);
      out[y * w + x] = grey[y * w + x] > t ? 255 : 0;
    }
}

function ditherRandom(grey, w, h, out) {
  let state = 0x12345678;
  for (let i = 0; i < w * h; i++) {
    state ^= state << 13; state ^= state >> 17; state ^= state << 5;
    out[i] = grey[i] > (state & 0xFF) ? 255 : 0;
  }
}

function effectDither(grey, w, h, out, method, threshold) {
  switch (method) {
    case 0: ditherFS(grey, w, h, out); break;
    case 1: ditherAtkinson(grey, w, h, out); break;
    case 2: ditherJarvis(grey, w, h, out); break;
    case 3: ditherStucki(grey, w, h, out); break;
    case 4: ditherBayer(grey, w, h, out, 2); break;
    case 5: ditherBayer(grey, w, h, out, 4); break;
    case 6: ditherBayer(grey, w, h, out, 8); break;
    case 7: ditherRandom(grey, w, h, out); break;
    case 8: for (let i = 0; i < w * h; i++) out[i] = grey[i] > threshold ? 255 : 0; break;
    default: ditherFS(grey, w, h, out); break;
  }
  for (let i = 0; i < w * h; i++) out[i] = 255 - out[i];
}

// ── Halftone ──────────────────────────────────────────────

function initScreens(maxSz) {
  const screens = [];
  for (let sz = 2; sz <= maxSz; sz++) {
    const half = sz / 2;
    let maxD = 0;
    const tmp = [];
    for (let y = 0; y < sz; y++) {
      tmp[y] = [];
      for (let x = 0; x < sz; x++) {
        const d = (x - half + 0.5) ** 2 + (y - half + 0.5) ** 2;
        tmp[y][x] = d;
        if (d > maxD) maxD = d;
      }
    }
    if (maxD < 0.001) maxD = 1;
    const screen = [];
    for (let y = 0; y < sz; y++) {
      screen[y] = [];
      for (let x = 0; x < sz; x++)
        screen[y][x] = Math.round(tmp[y][x] / maxD * 254);
    }
    screens[sz] = screen;
  }
  return screens;
}
const MAX_SCREEN = 16;
let screens = null;

function effectHalftone(grey, w, h, out, dotSize, thresh) {
  if (!screens) screens = initScreens(MAX_SCREEN);
  let sz = Math.max(2, Math.min(MAX_SCREEN, dotSize));
  const gamma = gammaFromThresh(thresh);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const gv = gamma === 1 ? grey[y*w+x] : applyGamma(grey[y*w+x], gamma);
      out[y * w + x] = gv > screens[sz][y % sz][x % sz] ? 255 : 0;
    }
  for (let i = 0; i < w * h; i++) out[i] = 255 - out[i];
}

function effectLine(grey, w, h, out, period, angle, thresh) {
  if (period < 4) period = 4;
  const rad = angle * Math.PI / 180;
  const sa = Math.sin(rad), ca = Math.cos(rad);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const d = x * sa + y * ca;
      let pos = d / period - Math.floor(d / period);
      if (pos < 0) pos += 1;
      const dist = pos > 0.5 ? 1 - pos : pos;
      const screen = Math.round((1 - 2 * dist) * 254);
      out[y * w + x] = grey[y * w + x] > Math.max(0, screen) ? 255 : 0;
    }
  for (let i = 0; i < w * h; i++) out[i] = 255 - out[i];
}

function effectCrosshatch(grey, w, h, out, period, thresh) {
  if (period < 4) period = 4;
  const r45 = Math.PI / 4;
  const s45 = Math.sin(r45), c45 = Math.cos(r45);
  const s135 = Math.sin(-r45), c135 = Math.cos(-r45);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const d1 = x * s45 + y * c45;
      let p1 = d1 / period - Math.floor(d1 / period);
      if (p1 < 0) p1 += 1;
      const dist1 = p1 > 0.5 ? 1 - p1 : p1;
      const s1 = Math.round((1 - 2 * dist1) * 254);
      const d2 = x * s135 + y * c135;
      let p2 = d2 / period - Math.floor(d2 / period);
      if (p2 < 0) p2 += 1;
      const dist2 = p2 > 0.5 ? 1 - p2 : p2;
      const s2 = Math.round((1 - 2 * dist2) * 254);
      const screen = Math.max(0, Math.min(s1, s2));
      out[y * w + x] = grey[y * w + x] > screen ? 255 : 0;
    }
  for (let i = 0; i < w * h; i++) out[i] = 255 - out[i];
}

// ── Pixelate ──────────────────────────────────────────────

function effectPixelate(grey, w, h, out, blockSize) {
  if (blockSize < 2) blockSize = 2;
  const cw = Math.max(1, Math.floor(w / blockSize));
  const ch = Math.max(1, Math.floor(h / blockSize));
  const small = new Uint8Array(cw * ch);
  for (let cy = 0; cy < ch; cy++)
    for (let cx = 0; cx < cw; cx++) {
      const sy = Math.min(cy * blockSize + Math.floor(blockSize / 2), h - 1);
      const sx = Math.min(cx * blockSize + Math.floor(blockSize / 2), w - 1);
      small[cy * cw + cx] = grey[sy * w + sx];
    }
  const dithered = new Uint8Array(cw * ch);
  ditherFS(small, cw, ch, dithered);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const sy = Math.min(Math.floor(y / blockSize), ch - 1);
      const sx = Math.min(Math.floor(x / blockSize), cw - 1);
      out[y * w + x] = dithered[sy * cw + sx];
    }
  for (let i = 0; i < w * h; i++) out[i] = 255 - out[i];
}

function effectAscii(grey, w, h, out, cols, charset) {
  if (cols < 8) cols = 8;
  const nchars = Math.min(charset.length, 32);
  const rows = Math.max(1, Math.round((h * cols) / w));
  const rw = cols * 8, rh = rows * 8;
  out.fill(0, 0, rw * rh);
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++) {
      const x0 = Math.floor(c * w / cols), x1 = Math.floor((c + 1) * w / cols);
      const y0 = Math.floor(r * h / rows), y1 = Math.floor((r + 1) * h / rows);
      let sum = 0, cnt = 0;
      for (let yy = y0; yy < y1; yy++)
        for (let xx = x0; xx < x1; xx++) { sum += grey[yy * w + xx]; cnt++; }
      let ci = Math.floor(sum / cnt * nchars / 256);
      if (ci >= nchars) ci = nchars - 1;
      let fidx = charset.charCodeAt(ci) - 32;
      if (fidx < 0 || fidx > 94) fidx = 0;
      for (let gy = 0; gy < 8 && r * 8 + gy < rh; gy++) {
        const row = FONT8x8[fidx * 8 + gy];
        for (let gx = 0; gx < 8 && c * 8 + gx < rw; gx++)
          if (row & (0x80 >> gx))
            out[(r * 8 + gy) * rw + (c * 8 + gx)] = 255;
      }
    }
  return {w: rw, h: rh};
}

function effectBinary(grey, w, h, out, cols) {
  if (cols < 8) cols = 8;
  const rows = Math.max(1, Math.round((h * cols) / w));
  const rw = cols * 8, rh = rows * 8;
  let sum = 0;
  for (let i = 0; i < w * h; i++) sum += grey[i];
  const avg = Math.floor(sum / (w * h));
  const bg = avg > 200 ? 180 : Math.max(avg, 100);
  out.fill(0, 0, rw * rh);
  const cset = ".,01";
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++) {
      const sx = Math.min(Math.floor(c * w / cols), w - 1);
      const sy = Math.min(Math.floor(r * h / rows), h - 1);
      const pv = grey[sy * w + sx];
      let ch = ' ';
      if (pv <= bg) {
        let idx = Math.floor((bg - pv) * 3 / bg);
        if (idx > 3) idx = 3;
        ch = cset[idx];
      }
      let fidx = ch.charCodeAt(0) - 32;
      if (fidx < 0 || fidx > 94) fidx = 0;
      for (let gy = 0; gy < 8 && r * 8 + gy < rh; gy++) {
        const row = FONT8x8[fidx * 8 + gy];
        for (let gx = 0; gx < 8 && c * 8 + gx < rw; gx++)
          if (row & (0x80 >> gx))
            out[(r * 8 + gy) * rw + (c * 8 + gx)] = 255;
      }
    }
  return {w: rw, h: rh};
}

// ── Silhouette ────────────────────────────────────────────

function effectSilhouette(grey, w, h, out, threshold) {
  for (let i = 0; i < w * h; i++)
    out[i] = grey[i] > threshold ? 255 : 0;
  for (let i = 0; i < w * h; i++) out[i] = 255 - out[i];
}

// ── Blocks ────────────────────────────────────────────────

function effectBlocks(grey, w, h, out, blockSize, levels) {
  if (blockSize < 2) blockSize = 2;
  if (blockSize > 16) blockSize = 16;
  if (levels < 2) levels = 2;
  if (levels > 8) levels = 8;
  const bs = blockSize;
  const total = bs * bs;
  const order = [];
  const cy = (bs - 1) / 2, cx = (bs - 1) / 2;
  for (let py = 0; py < bs; py++)
    for (let px = 0; px < bs; px++) {
      const d = Math.round((py - cy) ** 2 + (px - cx) ** 2);
      order.push({d, py, px});
    }
  order.sort((a, b) => a.d - b.d);
  const pat = [];
  for (let l = 0; l < levels; l++) {
    const p = new Uint8Array(bs * bs);
    const n = (l === levels - 1) ? total : Math.round(l * total / (levels - 1));
    for (let i = 0; i < n && i < total; i++)
      p[order[i].py * bs + order[i].px] = 255;
    pat.push(p);
  }
  const cw = Math.ceil(w / bs), ch = Math.ceil(h / bs);
  for (let gy = 0; gy < ch; gy++)
    for (let gx = 0; gx < cw; gx++) {
      const x0 = Math.floor(gx * w / cw), x1 = Math.floor((gx + 1) * w / cw);
      const y0 = Math.floor(gy * h / ch), y1 = Math.floor((gy + 1) * h / ch);
      let sum = 0, cnt = 0;
      for (let yy = y0; yy < y1; yy++)
        for (let xx = x0; xx < x1; xx++) { sum += grey[yy * w + xx]; cnt++; }
      const br = Math.floor(sum / cnt);
      let l = Math.floor(br * levels / 256);
      if (l >= levels) l = levels - 1;
      if (l < 0) l = 0;
      for (let py = 0; py < bs && gy * bs + py < h; py++)
        for (let px = 0; px < bs && gx * bs + px < w; px++)
          out[(gy * bs + py) * w + (gx * bs + px)] = pat[l][py * bs + px];
    }
  for (let i = 0; i < w * h; i++) out[i] = 255 - out[i];
}

// ── Comic / Ben-Day dots ──────────────────────────────────

function effectComic(grey, w, h, out, dotSize, levels) {
  if (dotSize < 2) dotSize = 2;
  if (dotSize > 16) dotSize = 16;
  if (levels < 2) levels = 2;
  if (levels > 8) levels = 8;
  const bs = dotSize;
  const total = bs * bs;
  const order = [];
  const cy = (bs - 1) / 2, cx = (bs - 1) / 2;
  for (let py = 0; py < bs; py++)
    for (let px = 0; px < bs; px++) {
      const d = Math.round((py - cy) ** 2 + (px - cx) ** 2);
      order.push({d, py, px});
    }
  order.sort((a, b) => a.d - b.d);
  const pat = [];
  for (let l = 0; l < levels; l++) {
    const p = new Uint8Array(bs * bs);
    const n = (l === levels - 1) ? total : Math.round(l * total / (levels - 1));
    for (let i = 0; i < n && i < total; i++)
      p[order[i].py * bs + order[i].px] = 255;
    pat.push(p);
  }
  const cw = Math.ceil(w / bs), ch = Math.ceil(h / bs);
  for (let gy = 0; gy < ch; gy++)
    for (let gx = 0; gx < cw; gx++) {
      const x0 = Math.floor(gx * w / cw), x1 = Math.floor((gx + 1) * w / cw);
      const y0 = Math.floor(gy * h / ch), y1 = Math.floor((gy + 1) * h / ch);
      let sum = 0, cnt = 0;
      for (let yy = y0; yy < y1; yy++)
        for (let xx = x0; xx < x1; xx++) { sum += grey[yy * w + xx]; cnt++; }
      const br = Math.floor(sum / cnt);
      let l = Math.floor(br * levels / 256);
      if (l >= levels) l = levels - 1;
      if (l < 0) l = 0;
      for (let py = 0; py < bs && gy * bs + py < h; py++)
        for (let px = 0; px < bs && gx * bs + px < w; px++)
          out[(gy * bs + py) * w + (gx * bs + px)] = pat[l][py * bs + px];
    }
  for (let i = 0; i < w * h; i++) out[i] = 255 - out[i];
}

// ── Pixel replication (post-process) ──────────────────────

function applyPixelReplication(bitmap, w, h, factor) {
  if (factor <= 1) return;
  const tmp = new Uint8Array(bitmap);
  for (let y = 0; y < h; y++) {
    const sy = Math.min(Math.floor(y / factor) * factor + Math.floor(factor / 2), h - 1);
    for (let x = 0; x < w; x++) {
      const sx = Math.min(Math.floor(x / factor) * factor + Math.floor(factor / 2), w - 1);
      bitmap[y * w + x] = tmp[sy * w + sx];
    }
  }
}

// ── Auto quality evaluator ───────────────────────────────
function evalQuality(bitmap, w, h) {
  let ink = 0, edges = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const p = y * w + x;
      if (bitmap[p] < 128) ink++;
      if (x > 0 && (bitmap[p] < 128) !== (bitmap[p - 1] < 128)) edges++;
      if (y > 0 && (bitmap[p] < 128) !== (bitmap[p - w] < 128)) edges++;
    }
  }
  const cov = ink / (w * h);
  let covScore;
  if (cov < 0.05 || cov > 0.80) covScore = 0;
  else if (cov < 0.10) covScore = (cov - 0.05) / 0.05;
  else if (cov > 0.60) covScore = (0.80 - cov) / 0.20;
  else covScore = 1;
  return Math.round(edges * covScore);
}

/* Run one effect and return {bitmap, w, h} */
function runEffect(small, outW, outH, fxId, thresh, dot, levels, invert) {
  let bitmap = new Uint8Array(outW * outH);
  let outW2 = outW, outH2 = outH;

  let effDot = dot;
  if (fxId === 9) effDot = 4;
  else if (fxId === 10 || fxId === 11) effDot = 8;

  switch (fxId) {
    case 0: effectDither(small, outW, outH, bitmap, 0, thresh); break;
    case 1: effectDither(small, outW, outH, bitmap, 1, thresh); break;
    case 2: effectDither(small, outW, outH, bitmap, 2, thresh); break;
    case 3: effectDither(small, outW, outH, bitmap, 3, thresh); break;
    case 4: effectDither(small, outW, outH, bitmap, 4, thresh); break;
    case 5: effectDither(small, outW, outH, bitmap, 5, thresh); break;
    case 6: effectDither(small, outW, outH, bitmap, 6, thresh); break;
    case 7: effectDither(small, outW, outH, bitmap, 7, thresh); break;
    case 8: effectDither(small, outW, outH, bitmap, 8, thresh); break;
    case 9: effectHalftone(small, outW, outH, bitmap, effDot, thresh); break;
    case 10: effectLine(small, outW, outH, bitmap, effDot, 45, thresh); break;
    case 11: effectCrosshatch(small, outW, outH, bitmap, effDot, thresh); break;
    case 12: effectPixelate(small, outW, outH, bitmap, dot); break;
    case 13: {
      const cols = Math.floor(outW / 8);
      const cs = invert ? "@%#*+=-:. " : " .:-=+*#%@";
      const r = effectAscii(small, outW, outH, bitmap, cols, cs);
      outW2 = r.w; outH2 = r.h;
      break;
    }
    case 14: {
      const cols = Math.floor(outW / 8);
      const r = effectBinary(small, outW, outH, bitmap, cols);
      outW2 = r.w; outH2 = r.h;
      break;
    }
    case 15: effectComic(small, outW, outH, bitmap, dot, levels); break;
    case 16: effectSilhouette(small, outW, outH, bitmap, thresh); break;
    case 17: effectBlocks(small, outW, outH, bitmap, dot, levels); break;
  }

  const doRep = !(fxId === FX_ASCII || fxId === FX_BINARY || FX_INTERNAL_DOT.has(fxId));
  if (doRep && dot > 1) applyPixelReplication(bitmap, outW2, outH2, dot);

  if (fxId !== FX_BINARY)
    for (let i = 0; i < outW2 * outH2; i++) bitmap[i] = 255 - bitmap[i];
  if (invert)
    for (let i = 0; i < outW2 * outH2; i++) bitmap[i] = 255 - bitmap[i];

  return {bitmap, w: outW2, h: outH2};
}

// ── Main render pipeline ──────────────────────────────────
const OUTPUT_W = 384;

function render() {
  updateDisplay();
  if (!sourceImageData) return;

  const {data: srcData, w: sw, h: sh} = sourceImageData;
  const fxId = +effectSel.value;
  const thresh = p_thresh;
  const dot = p_dot;
  const levels = p_levels;
  const invert = invertChk.checked;
  const preproc = preprocChk.checked;

  const outH = Math.round(sh * OUTPUT_W / sw);

  let small = greyResize(srcData, sw, sh, OUTPUT_W, outH);
  if (preproc) preprocAll(small, OUTPUT_W, outH, thresh);

  const result = runEffect(small, OUTPUT_W, outH, fxId, thresh, dot, levels, invert);
  let {bitmap, w: outW, h: outH2} = result;

  // Display output
  const octx = outputCanvas.getContext('2d');
  outputCanvas.width = outW;
  outputCanvas.height = outH2;
  const oid = octx.createImageData(outW, outH2);
  for (let i = 0; i < outW * outH2; i++) {
    const v = 255 - bitmap[i];
    oid.data[i*4] = oid.data[i*4+1] = oid.data[i*4+2] = v;
    oid.data[i*4+3] = 255;
  }
  octx.putImageData(oid, 0, 0);

  dispStatus.textContent = `Rendered ${outW}×${outH2}`;
}

// ── Save ──────────────────────────────────────────────────
saveBtn.onclick = () => {
  const link = document.createElement('a');
  link.download = `1bitcam_${FX[+effectSel.value].name}.png`;
  link.href = outputCanvas.toDataURL();
  link.click();
};

renderBtn.onclick = render;

// ── Video flipbook ─────────────────────────────────────────
let videoFrames = [], videoAnimId = null, videoFrameIdx = 0, videoLastTime = 0;
const VIDEO_FPS = 5;

function shakeImage(data, w, h, maxPx) {
  const dx = Math.round((Math.random() - 0.5) * 2 * maxPx);
  const dy = Math.round((Math.random() - 0.5) * 2 * maxPx);
  const out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const sx = Math.max(0, Math.min(w - 1, x + dx));
      const sy = Math.max(0, Math.min(h - 1, y + dy));
      out[y * w + x] = data[sy * w + sx];
    }
  return out;
}

function drawFrame(frame) {
  const octx = outputCanvas.getContext('2d');
  outputCanvas.width = frame.w; outputCanvas.height = frame.h;
  const oid = octx.createImageData(frame.w, frame.h);
  for (let i = 0; i < frame.w * frame.h; i++) {
    const v = 255 - frame.bitmap[i];
    oid.data[i*4] = oid.data[i*4+1] = oid.data[i*4+2] = v;
    oid.data[i*4+3] = 255;
  }
  octx.putImageData(oid, 0, 0);
}

function renderStrip() {
  if (!videoFrames.length) return;
  const fw = videoFrames[0].w, fh = videoFrames[0].h, n = videoFrames.length;
  const octx = outputCanvas.getContext('2d');
  outputCanvas.width = fw; outputCanvas.height = fh * n;
  const oid = octx.createImageData(fw, fh * n);
  for (let f = 0; f < n; f++)
    for (let y = 0; y < fh; y++)
      for (let x = 0; x < fw; x++) {
        const di = (f * fh + y) * fw + x;
        const v = 255 - videoFrames[f].bitmap[y * fw + x];
        oid.data[di*4] = oid.data[di*4+1] = oid.data[di*4+2] = v;
        oid.data[di*4+3] = 255;
      }
  octx.putImageData(oid, 0, 0);
  document.getElementById('videoStatus').textContent =
    n + ' frames (' + fw + '\u00D7' + (fh * n) + ')';
}

function startAnimation() {
  if (videoAnimId) cancelAnimationFrame(videoAnimId);
  videoFrameIdx = 0; videoLastTime = performance.now();
  document.getElementById('playBtn').textContent = '\u25A0 Stop';
  function animate(now) {
    if ((now - videoLastTime) >= 1000 / VIDEO_FPS) {
      videoLastTime = now;
      if (document.getElementById('stripChk').checked) { renderStrip(); }
      else {
        drawFrame(videoFrames[videoFrameIdx]);
        document.getElementById('videoStatus').textContent =
          'Frame ' + (videoFrameIdx + 1) + '/' + videoFrames.length;
        videoFrameIdx = (videoFrameIdx + 1) % videoFrames.length;
      }
    }
    videoAnimId = requestAnimationFrame(animate);
  }
  videoAnimId = requestAnimationFrame(animate);
}

function stopAnimation() {
  if (videoAnimId) { cancelAnimationFrame(videoAnimId); videoAnimId = null; }
  document.getElementById('playBtn').textContent = '\u25B6 Play';
}

function extractVideoFrames(count, onProgress) {
  return new Promise(resolve => {
    const video = document.getElementById('hiddenVideo');
    const dur = video.duration, step = dur / (count + 1);
    const frames = []; let idx = 0;
    const c = document.createElement('canvas');
    function next() {
      if (idx >= count) { resolve(frames); return; }
      video.currentTime = (idx + 1) * step;
    }
    video.onseeked = () => {
      c.width = video.videoWidth; c.height = video.videoHeight;
      const ctx = c.getContext('2d');
      ctx.drawImage(video, 0, 0);
      const id = ctx.getImageData(0, 0, c.width, c.height);
      const grey = new Uint8Array(c.width * c.height);
      for (let i = 0; i < grey.length; i++)
        grey[i] = Math.round(id.data[i*4]*0.299 + id.data[i*4+1]*0.587 + id.data[i*4+2]*0.114);
      frames.push({data: grey, w: c.width, h: c.height});
      if (onProgress) onProgress(idx + 1, count);
      idx++; next();
    };
    next();
  });
}

function captureVideo() {
  const numFrames = +document.getElementById('vfCount').value;
  const fxId = +effectSel.value, thresh = p_thresh, dot = p_dot, levels = p_levels;
  const invert = invertChk.checked, preproc = preprocChk.checked;

  /* Video source — extract real frames */
  if (videoDuration > 0 && document.getElementById('hiddenVideo').readyState >= 2) {
    document.getElementById('videoStatus').textContent = 'Extracting...';
    extractVideoFrames(numFrames, (n, t) => {
      document.getElementById('videoStatus').textContent = 'Extracting ' + n + '/' + t;
    }).then(vf => {
      videoFrames = [];
      for (let f = 0; f < vf.length; f++) {
        const {data, w: sw, h: sh} = vf[f];
        const outH = Math.round(sh * OUTPUT_W / sw);
        let small = greyResize(data, sw, sh, OUTPUT_W, outH);
        if (preproc) preprocAll(small, OUTPUT_W, outH, thresh);
        videoFrames.push(runEffect(small, OUTPUT_W, outH, fxId, thresh, dot, levels, invert));
      }
      document.getElementById('playBtn').disabled = false;
      document.getElementById('stripSaveBtn').disabled = false;
      document.getElementById('videoStatus').textContent = videoFrames.length + ' frames (video)';
      startAnimation();
    });
    return;
  }

  /* Image source — camera shake fallback */
  if (!sourceImageData) { alert('Load an image or video first'); return; }
  const {data: srcData, w: sw, h: sh} = sourceImageData;
  const outH = Math.round(sh * OUTPUT_W / sw), shift = Math.max(1, Math.round(OUTPUT_W * 0.025));
  /* Crop shift pixels from each edge so shake never exposes white borders */
  const cropX = shift, cropY = shift, cropW = sw - 2 * cropX, cropH = sh - 2 * cropY;
  const cropped = new Uint8Array(cropW * cropH);
  for (let y = 0; y < cropH; y++)
    for (let x = 0; x < cropW; x++)
      cropped[y * cropW + x] = srcData[(y + cropY) * sw + (x + cropX)];
  videoFrames = [];
  for (let i = 0; i < numFrames; i++) {
    let small = greyResize(shakeImage(cropped, cropW, cropH, shift), cropW, cropH, OUTPUT_W, outH);
    if (preproc) preprocAll(small, OUTPUT_W, outH, thresh);
    videoFrames.push(runEffect(small, OUTPUT_W, outH, fxId, thresh, dot, levels, invert));
  }
  document.getElementById('playBtn').disabled = false;
  document.getElementById('stripSaveBtn').disabled = false;
  document.getElementById('videoStatus').textContent = numFrames + ' frames (camera shake)';
  startAnimation();
}

document.getElementById('videoBtn').onclick = captureVideo;
document.getElementById('playBtn').onclick = () => {
  if (videoAnimId) { stopAnimation(); if (videoFrames.length) drawFrame(videoFrames[0]); }
  else if (videoFrames.length) startAnimation();
};
document.getElementById('stripChk').onchange = () => {
  if (videoFrames.length && videoAnimId && document.getElementById('stripChk').checked) {
    renderStrip();
  }
};
document.getElementById('stripSaveBtn').onclick = () => {
  if (!videoFrames.length) return;
  renderStrip();
  const l = document.createElement('a');
  l.download = '1bitcam_' + FX[+effectSel.value].name + '_strip.png';
  l.href = outputCanvas.toDataURL(); l.click();
};

// Init
updateDisplay();
// Load a default test card
testcardBtn.click();
</script>
